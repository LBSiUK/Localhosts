name: Localhosts
options:
  bundleIdPrefix: uk.lbsi
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Localhosts:
    type: application
    platform: macOS
    sources:
      - Localhosts
      - path: skill/SKILL.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Localhosts
        PRODUCT_BUNDLE_IDENTIFIER: uk.lbsi.Localhosts
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Localhosts
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Localhosts brings up the Terminal tab that started a server, and opens a new window to resume a Claude session."
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 LBSi UK / Leon Brahams"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Localhosts/Localhosts.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LocalhostsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - LocalhostsTests
      - Localhosts/Core
      - Localhosts/CLI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Localhosts:
    build:
      targets:
        Localhosts: all
        LocalhostsTests: [test]
    test:
      targets: [LocalhostsTests]
